name: 功能建议
description: 提议新的模型接口、交互或工作流能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述真实使用场景，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 需要新增第三方模型接口
        - label: 涉及本地数据或密钥存储
        - label: 涉及 Windows 桌面端权限或系统能力
