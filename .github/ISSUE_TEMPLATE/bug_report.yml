name: Bug 报告
description: 报告可复现的功能或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿在 Issue 中粘贴 API Key、真实用户数据或其他敏感信息。
  - type: dropdown
    id: surface
    attributes:
      label: 使用方式
      options:
        - Windows 桌面版
        - 浏览器开发版
        - 两者均出现
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按 1、2、3 列出最短复现路径
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      placeholder: 例如言构 0.1.0 / Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可附截图或脱敏日志，请先移除密钥和个人信息。
